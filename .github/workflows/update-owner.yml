name: Update GitHub owner references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-owner.yml'

permissions:
  contents: write

jobs:
  update-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old owner references
        shell: bash
        run: |
          set -e
          # One-time migration after the GitHub username change.
          git grep -Il -e 'fedidinho.github.io' -e 'Fedidinho' | while IFS= read -r file; do
            sed -i \
              -e 's/fedidinho\.github\.io/felipeempreendimentos.github.io/g' \
              -e 's/Fedidinho/FelipeEmpreendimentos/g' \
              "$file"
          done

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No references to update.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Atualiza referências para FelipeEmpreendimentos'
          git push
