name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f assets/logo.svg
          test -f assets/favicon.svg
          test -f manifest.webmanifest
          test -f robots.txt
          test -f sitemap.xml
          test -f odontologia/index.html
          test -f odontologia/style.css
          test -f odontologia/script.js
          test -f odontologia/assets/logo.svg
          test -f odontologia/assets/favicon.svg
          test -f odontologia/manifest.webmanifest
          test -f imobiliaria/index.html
          test -f imobiliaria/style.css
          test -f imobiliaria/script.js
          test -f imobiliaria/assets/logo.svg
          test -f imobiliaria/assets/favicon.svg
          test -f imobiliaria/manifest.webmanifest

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check odontologia/script.js
          node --check imobiliaria/script.js

      - name: Check essential HTML metadata
        run: |
          grep -q '<meta name="description"' index.html
          grep -q '<meta property="og:title"' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'style.css' index.html
          grep -q 'script.js' index.html
          grep -q '<meta name="description"' odontologia/index.html
          grep -q '<meta property="og:title"' odontologia/index.html
          grep -q 'application/ld+json' odontologia/index.html
          grep -q 'style.css' odontologia/index.html
          grep -q 'script.js' odontologia/index.html
          grep -q '<meta name="description"' imobiliaria/index.html
          grep -q '<meta property="og:title"' imobiliaria/index.html
          grep -q 'application/ld+json' imobiliaria/index.html
          grep -q 'style.css' imobiliaria/index.html
          grep -q 'script.js' imobiliaria/index.html
