name: Validate static site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f assets/logo.svg
          test -f assets/favicon.svg
          test -f manifest.webmanifest
          test -f robots.txt
          test -f sitemap.xml
          test -f odontologia/index.html
          test -f odontologia/style.css
          test -f odontologia/script.js
          test -f odontologia/assets/logo.svg
          test -f odontologia/assets/favicon.svg
          test -f odontologia/manifest.webmanifest
          test -f imobiliaria/index.html
          test -f imobiliaria/style.css
          test -f imobiliaria/script.js
          test -f imobiliaria/assets/logo.svg
          test -f imobiliaria/assets/favicon.svg
          test -f imobiliaria/manifest.webmanifest
          test -f oficina/index.html
          test -f oficina/style.css
          test -f oficina/script.js
          test -f oficina/assets/logo.svg
          test -f oficina/assets/favicon.svg
          test -f oficina/manifest.webmanifest

      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check odontologia/script.js
          node --check imobiliaria/script.js
          node --check oficina/script.js

      - name: Check essential HTML metadata
        run: |
          for page in index.html odontologia/index.html imobiliaria/index.html oficina/index.html; do
            grep -q '<meta name="description"' "$page"
            grep -q '<meta property="og:title"' "$page"
            grep -q 'application/ld+json' "$page"
            grep -q 'style.css' "$page"
            grep -q 'script.js' "$page"
          done
